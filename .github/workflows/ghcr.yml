name: CI + GHCR

# Triggers:
#   - PRs to master:    test only (build + go test)
#   - push to master:   test only
#   - push tag v*:      test, build multi-arch image, push to GHCR
#                       as :<tag> AND :latest
#   - workflow_dispatch: test, build multi-arch image, push to GHCR
#                        as :<short-sha> only (no :latest)
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*', '*-fluentstream*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install build deps (libpcap, luajit-5.1)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev libluajit-5.1-dev pkg-config

      - name: Build
        run: make all

      - name: Test
        run: go test -vet=off ./...

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # On a tag push: ghcr.io/<repo>:<tag> + ghcr.io/<repo>:latest
        # On manual dispatch: ghcr.io/<repo>:<short-sha> (debug builds, no :latest)
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${TAG},${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
